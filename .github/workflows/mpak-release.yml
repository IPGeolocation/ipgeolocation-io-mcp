name: mpak Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git tag to build (must match release_tag)
        required: true
      release_tag:
        description: Existing GitHub release tag to upload assets to
        required: true

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: tooling
          persist-credentials: false

      - name: Check out source ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false

      - name: Bind source ref to workflow provenance
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          if [ "$SOURCE_REF" != "$RELEASE_TAG" ]; then
            echo "::error::source_ref ($SOURCE_REF) must match release_tag ($RELEASE_TAG)."
            exit 1
          fi

          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "::error::Dispatch this workflow from the $RELEASE_TAG tag."
            exit 1
          fi

          SOURCE_SHA=$(git rev-parse HEAD)
          if [ "$SOURCE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::source_ref resolved to $SOURCE_SHA, but this workflow run is bound to $GITHUB_SHA."
            echo "::error::Dispatch the workflow from the same tag supplied as source_ref."
            exit 1
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: source/package-lock.json

      - name: Install CycloneDX 1.6 SBOM generator
        run: |
          set -euo pipefail

          curl -fsSL \
            https://github.com/anchore/syft/releases/download/v1.29.1/syft_1.29.1_linux_amd64.tar.gz \
            -o /tmp/syft.tar.gz
          echo "ca704907e5a7b697c6e683832ca128e2ae60de63d7d87f3e2e39672df9038fa4  /tmp/syft.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C /tmp syft
          sudo install -m 0755 /tmp/syft /usr/local/bin/syft

      - name: Verify release exists
        working-directory: tooling
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release view "${{ inputs.release_tag }}"

      - name: Install root dependencies
        working-directory: source
        run: npm ci --ignore-scripts

      - name: Verify release version metadata
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          VERSION=$(jq -r '.version' package.json)
          EXPECTED_TAG="v$VERSION"

          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::release_tag ($RELEASE_TAG) must match package version ($EXPECTED_TAG)."
            exit 1
          fi

          jq -e --arg version "$VERSION" '.version == $version' manifest.json >/dev/null
          jq -e --arg version "$VERSION" \
            '.version == $version and .packages[0].version == $version' \
            server.json >/dev/null

      - name: Audit root dependencies
        working-directory: source
        run: npm audit --audit-level=moderate

      - name: Run root test suite
        working-directory: source
        run: npm test

      - name: Prepare isolated mpak package
        working-directory: tooling
        env:
          MPAK_SOURCE_DIR: ../source
        run: node scripts/prepare-mpak-package.mjs

      - name: Generate bundled SBOM
        working-directory: tooling
        run: node scripts/generate-mpak-sbom.mjs

      - name: Build universal mpak bundle
        id: build_bundle
        uses: NimbleBrainInc/mcpb-pack@e74c82722fa4b954ce7740f875d6c437ae471df6
        with:
          directory: tooling/artifacts/mpak-package
          upload: false
          announce: false
          platform-os: any
          platform-arch: any

      - name: Finalize mpak bundle metadata
        working-directory: tooling
        run: >-
          node scripts/finalize-mpak-bundle.mjs
          "artifacts/mpak-package/${{ steps.build_bundle.outputs.bundle-path }}"
          "artifacts/mpak-package"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign mpak bundle with Sigstore keyless
        id: sign_bundle
        working-directory: tooling/artifacts/mpak-package
        run: |
          set -euo pipefail

          BUNDLE_FILENAME="${{ steps.build_bundle.outputs.bundle-path }}"
          SIGNATURE_BUNDLE="${BUNDLE_FILENAME}.sigstore.json"

          cosign sign-blob \
            --yes \
            --bundle "$SIGNATURE_BUNDLE" \
            "$BUNDLE_FILENAME"

          echo "signature_bundle=$SIGNATURE_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance attestation
        id: attest_bundle
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: tooling/artifacts/mpak-package/${{ steps.build_bundle.outputs.bundle-path }}

      - name: Stage provenance bundle asset
        id: stage_attestation
        working-directory: tooling
        run: |
          set -euo pipefail

          ATTESTATION_ASSET="artifacts/mpak-package/${{ steps.build_bundle.outputs.bundle-path }}.provenance.sigstore.json"
          cp "${{ steps.attest_bundle.outputs.bundle-path }}" "$ATTESTATION_ASSET"

          echo "attestation_asset=$ATTESTATION_ASSET" >> "$GITHUB_OUTPUT"

      - name: Verify signature and provenance
        working-directory: tooling
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: artifacts/mpak-package/${{ steps.build_bundle.outputs.bundle-path }}
          SIGNATURE_PATH: artifacts/mpak-package/${{ steps.sign_bundle.outputs.signature_bundle }}
          ATTESTATION_ASSET: ${{ steps.stage_attestation.outputs.attestation_asset }}
        run: |
          set -euo pipefail

          cosign verify-blob \
            --bundle "$SIGNATURE_PATH" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity \
              "https://github.com/$GITHUB_REPOSITORY/.github/workflows/mpak-release.yml@$GITHUB_REF" \
            "$BUNDLE_PATH"

          gh attestation verify \
            "$BUNDLE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$ATTESTATION_ASSET" \
            --cert-identity \
              "https://github.com/$GITHUB_REPOSITORY/.github/workflows/mpak-release.yml@$GITHUB_REF" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA"

      - name: Upload mpak assets to the tagged release
        working-directory: tooling
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            "artifacts/mpak-package/${{ steps.build_bundle.outputs.bundle-path }}" \
            artifacts/mpak-package/server.json \
            artifacts/mpak-package/sbom.cdx.json \
            "artifacts/mpak-package/${{ steps.sign_bundle.outputs.signature_bundle }}" \
            "${{ steps.stage_attestation.outputs.attestation_asset }}" \
            --clobber

      - name: Announce universal mpak bundle
        working-directory: tooling/artifacts/mpak-package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUNDLE_FILENAME: ${{ steps.build_bundle.outputs.bundle-path }}
        run: |
          set -euo pipefail

          if [ ! -f "$BUNDLE_FILENAME" ]; then
            echo "::error::Bundle not found: $BUNDLE_FILENAME"
            exit 1
          fi

          OIDC_TOKEN=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://mpak.dev" \
            | jq -r '.value')

          if [ "$OIDC_TOKEN" = "null" ] || [ -z "$OIDC_TOKEN" ]; then
            echo "::error::Failed to get OIDC token. Ensure permissions.id-token=write is set."
            exit 1
          fi

          NAME=$(jq -r '.name' manifest.json)
          VERSION=$(jq -r '.version' manifest.json)
          PRERELEASE=$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')

          if stat -f%z "$BUNDLE_FILENAME" >/dev/null 2>&1; then
            SIZE=$(stat -f%z "$BUNDLE_FILENAME")
          else
            SIZE=$(stat -c%s "$BUNDLE_FILENAME")
          fi

          if command -v shasum >/dev/null 2>&1; then
            SHA256=$(shasum -a 256 "$BUNDLE_FILENAME" | awk '{print $1}')
          else
            SHA256=$(sha256sum "$BUNDLE_FILENAME" | awk '{print $1}')
          fi

          PAYLOAD=$(jq -n \
            --arg name "$NAME" \
            --arg version "$VERSION" \
            --slurpfile manifest manifest.json \
            --arg release_tag "$RELEASE_TAG" \
            --argjson prerelease "$PRERELEASE" \
            --arg filename "$BUNDLE_FILENAME" \
            --arg os "any" \
            --arg arch "any" \
            --arg sha256 "$SHA256" \
            --argjson size "$SIZE" \
            '{
              name: $name,
              version: $version,
              manifest: $manifest[0],
              release_tag: $release_tag,
              prerelease: $prerelease,
              artifact: {
                filename: $filename,
                os: $os,
                arch: $arch,
                sha256: $sha256,
                size: $size
              }
            }')

          echo "Announcing $NAME v$VERSION for release $RELEASE_TAG"

          MAX_ATTEMPTS=4
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            RESPONSE=$(curl -sS -w "\n%{http_code}" \
              -X POST "https://registry.mpak.dev/v1/bundles/announce" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -d "$PAYLOAD")

            HTTP_CODE=$(printf '%s\n' "$RESPONSE" | tail -n 1)
            BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Bundle announced successfully"
              echo "$BODY" | jq .
              exit 0
            fi

            if [ "$HTTP_CODE" -eq 409 ]; then
              echo "Bundle already registered"
              echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
              exit 0
            fi

            if printf '%s' "$BODY" | grep -Eq 'not found in release'; then
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                WAIT_SECONDS=$((ATTEMPT * 5))
                echo "Release assets not visible yet, retrying in ${WAIT_SECONDS}s..."
                sleep "$WAIT_SECONDS"
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi
            fi

            echo "::error::Failed to announce bundle (HTTP $HTTP_CODE)"
            echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
            exit 1
          done
