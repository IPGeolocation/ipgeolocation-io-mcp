# Include inside Nginx's http context. Requires an existing public TLS certificate.
log_format mcp_safe '$request_method $status $request_time $upstream_status';

server {
    listen 443 ssl;
    server_name mcp.ipgeolocation.io;
    if ($host != mcp.ipgeolocation.io) { return 421; }
    ssl_certificate /etc/letsencrypt/live/mcp.ipgeolocation.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.ipgeolocation.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/mcp.access.log mcp_safe;
    # Nginx request errors can contain full URLs. App logs and safe upstream status cover failures.
    error_log /dev/null crit;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 32m;
    client_body_buffer_size 64k;
    # Use a dedicated, size-bounded filesystem, writable only by Nginx (see HOSTED.md).
    client_body_temp_path /var/cache/nginx/mcp_body;
    client_body_timeout 10s;

    location = /mcp {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 130s;
        proxy_send_timeout 30s;
        proxy_set_header Host mcp.ipgeolocation.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-IPGeolocation-API-Key $http_x_ipgeolocation_api_key;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header Mcp-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header Connection "";
    }
    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host mcp.ipgeolocation.io;
    }
    location / { return 404; }
}
